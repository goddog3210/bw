    .preset-label { margin:0; color:var(--muted); font-size:13px; white-space:nowrap; font-weight:800; text-align:center; } .preset-group { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; width:100%; } .preset-btn { min-height:34px; padding:3px 4px; color:var(--muted); font-size:13px; font-weight:750; white-space:nowrap; background:var(--surface-alt); border:1px solid var(--line); border-radius:9px; transition:.2s; } .preset-btn:hover { color:var(--blue); border-color:#a8c4ff; background:var(--blue-soft); } .preset-btn.active { color:#fff; background:var(--blue); border-color:var(--blue); }

    .analysis-panel { padding:12px 16px; } .analysis-top { display:grid; grid-template-columns:minmax(0,1fr) minmax(320px,520px) minmax(0,1fr); align-items:start; gap:12px; margin-bottom:4px; } .analysis-title { margin:0; font-size:clamp(17px,2vw,21px); line-height:1.25; letter-spacing:-.03em; } .analysis-context { margin:4px 0 0; color:var(--muted); font-size:12px; } .analysis-metric { margin:3px 0 0; color:#38506e; font-size:12px; font-weight:650; } .analysis-actions { display:flex; align-items:center; flex-wrap:wrap; justify-content:flex-end; justify-self:end; gap:9px; } .mode-switch { display:inline-flex; padding:3px; background:#eef3fb; border:1px solid #c9d7eb; border-radius:11px; } .mode-btn { min-height:40px; padding:8px 13px; color:#52657a; font-size:13px; font-weight:800; background:transparent; border:0; border-radius:8px; } .mode-btn:hover { color:var(--blue); background:#f8fbff; } .mode-btn.active { color:#fff; background:var(--blue); box-shadow:0 3px 8px rgba(37,99,235,.28); } .ghost-btn { min-height:38px; padding:7px 10px; color:var(--muted); font-size:12px; font-weight:700; background:#fff; border:1px solid var(--line); border-radius:9px; } .ghost-btn:hover { color:var(--blue); border-color:#a9bce0; } .chart-tip { margin:4px 0 0; color:var(--muted); font-size:12px; } .chart-container { position:relative; height:clamp(300px,38vw,480px); padding:4px 4px 0; } canvas { max-width:100%; }
    .fusion-toggle { display:inline-flex; align-items:center; height:38px; padding:7px 10px; color:var(--muted); font-size:12px; font-weight:700; background:#fff; border:1px solid var(--line); border-radius:9px; cursor:pointer; transition:.2s; } .fusion-toggle:hover { color:var(--blue); border-color:#a9bce0; } .fusion-toggle input { position:absolute; opacity:0; pointer-events:none; } .fusion-toggle:has(input:checked) { color:var(--amber); background:var(--amber-soft); border-color:#e8c46b; } .fusion-toggle--disabled { opacity:.55; cursor:not-allowed; } .legend-bar { display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; margin-top:10px; padding:10px 0 0; border-top:1px solid var(--line); } .legend-bar--toolbar { grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); margin:-24px 0 3px; padding:0 0 5px; border-top:0; border-bottom:1px solid var(--line); } .legend-bar--toolbar .legend-group { grid-column:2; justify-content:center; align-self:end; } .legend-bar--toolbar .insight { grid-column:3; justify-self:end; } .legend-group { display:flex; flex-wrap:wrap; gap:10px 15px; margin:0; padding:0; list-style:none; } .legend-item { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; font-weight:650; } .dot { width:9px; height:9px; flex:none; border-radius:50%; } .dot--blue{background:var(--blue)} .dot--green{background:var(--green)} .dot--amber{background:var(--amber)} .dot--red{background:var(--red)} .dot--slate{background:var(--slate)} .insight { max-width:530px; padding:8px 11px; color:#16634f; background:var(--green-soft); border-radius:9px; font-size:12px; font-weight:750; } .insight--amber { color:#8a4708; background:var(--amber-soft); }
    .accessible-summary { margin:10px 0 0; color:var(--muted); font-size:12px; } details { margin-top:10px; background:var(--surface-alt); border:1px solid var(--line); border-radius:10px; } summary { padding:10px 12px; color:var(--ink); font-size:12px; font-weight:750; cursor:pointer; } .table-wrap { overflow-x:auto; padding:0 12px 12px; } table { width:100%; min-width:560px; border-collapse:collapse; font-size:12px; } th,td { padding:8px 10px; text-align:right; border-top:1px solid var(--line); } th { color:var(--muted); font-weight:750; } th:first-child,td:first-child { text-align:left; }
    @media (max-width:620px) { .shell{padding:12px}.overview{grid-template-columns:1fr}.panel,.analysis-panel{padding:14px}.preset-group{grid-template-columns:repeat(4,1fr)}.analysis-top{grid-template-columns:1fr;align-items:stretch}.analysis-actions{justify-content:flex-start;width:100%}.mode-switch{width:100%}.mode-btn{flex:1;padding-inline:7px}.legend-bar{grid-template-columns:1fr}.legend-bar--toolbar .legend-group,.legend-bar--toolbar .insight{grid-column:1}.legend-bar--toolbar .insight{justify-self:stretch}.insight{max-width:none}.chart-container{height:350px}.tiers-grid{grid-template-columns:1fr}.tier-card--midway{grid-column:auto} } @media (max-width:390px) {.input-summary-row{grid-template-columns:1fr}.preset-group{grid-template-columns:repeat(3,1fr)}.tier-card{grid-template-columns:max-content minmax(0,1fr);grid-template-areas:"name name" "cost-label cost" "output output"}.tier-card--anniversary{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"name anniversary-input" "cost-label cost" "output output" "total total"}.tier-card--midway{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"name midway-input" "cost-label cost" "output output"}.tier-selected{top:-10px;left:50%;right:auto}} @media (prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}} @media (forced-colors:active){.tier-card.active,.preset-btn.active,.mode-btn.active{outline:2px solid Highlight;outline-offset:2px}}

<body>
  <main class="shell">
    <div class="dashboard">
      <div class="overview">
        <section class="panel" aria-label="抽卡数据设置">
          <form id="calculatorForm" novalidate><fieldset><legend>输入抽卡数据</legend><div class="input-summary-row"><div class="input-field"><label for="totalPulls">总抽数</label><input type="number" id="totalPulls" value="10000" min="1" step="1" inputmode="decimal"></div><div class="input-field"><label for="orangeCards">橙卡数</label><input type="number" id="orangeCards" value="100" min="0" step="any" inputmode="decimal"></div><div class="probability" aria-live="polite"><span class="probability__label">当前<br>出橙概率</span><output id="probVal">1.000%</output></div></div></fieldset><p class="form-message" id="formMessage" role="alert"></p></form>          <p class="preset-label">快速概率预设</p><div class="preset-group" id="presetGroup" aria-label="快速概率预设"><button type="button" class="preset-btn" data-probability="0.8" data-name="非酋" aria-pressed="false">非酋 0.8%</button><button type="button" class="preset-btn" data-probability="0.9" data-name="小黑" aria-pressed="false">小黑 0.9%</button><button type="button" class="preset-btn active" data-probability="1" data-name="标准" aria-pressed="true">标准 1%</button><button type="button" class="preset-btn" data-probability="1.1" data-name="小欧" aria-pressed="false">小欧 1.1%</button><button type="button" class="preset-btn" data-probability="1.2" data-name="欧皇" aria-pressed="false">欧皇 1.2%</button></div>
        </section>
        <section class="panel tiers-panel" aria-label="成本档位"><div class="tiers-grid" id="tiersContainer" role="radiogroup" aria-label="成本档位"></div></section>
      </div>
      <section class="panel analysis-panel" aria-labelledby="analysis-title"><div class="analysis-top"><div><h2 class="analysis-title" id="chartTitle">收益综合分析</h2><p class="analysis-context" id="analysisContext">选择档位后查看完整数据</p><p class="analysis-metric" id="analysisMetric"></p><p class="chart-tip" id="chartTip">滚轮或双指缩放，拖拽平移；悬停数据点查看详细数值。</p></div><div class="probability-range probability-range--analysis"><div class="range-meta"><span>非酋 · 0.10%</span><strong>欧非滑块</strong><span>欧皇 · 3.00%</span></div><input id="probabilityRange" type="range" min="0.10" max="3.00" step="0.01" value="1.00" aria-label="出橙概率，范围 0.10% 至 3.00%" aria-valuetext="1.000%"></div><div class="analysis-actions"><label class="fusion-toggle" id="fusionToggleWrap"><input id="fusionCostToggle" type="checkbox"><span>溶合成本线</span></label><div class="mode-switch" role="tablist" aria-label="分析视角"><button class="mode-btn active" id="btnModeSingle" type="button" role="tab" aria-selected="true">单套兑换</button><button class="mode-btn" id="btnMode90Days" type="button" role="tab" aria-selected="false">90 天累计</button></div><button class="ghost-btn" id="resetZoom" type="button">重置缩放</button></div></div><div class="legend-bar legend-bar--toolbar" id="legendBar"></div><figure class="analysis-figure"><div class="chart-container"><canvas id="rewardChart" role="img" aria-labelledby="chartTitle" aria-describedby="analysisContext analysisMetric chartTip"></canvas></div></figure><details><summary>查看当前分析的明细数据</summary><div class="table-wrap" id="dataTable"></div></details></section>
    </div>
  </main>
<script>
const COLORS={blue:'#2563eb',green:'#0f9b7a',amber:'#b45309',red:'#d64545',slate:'#52657a',grid:'#e8edf5',tick:'#64748b',tooltip:'#172033'};
const $=id=>document.getElementById(id); const money=(value,digits=2)=>'$'+Number(value).toLocaleString(undefined,{minimumFractionDigits:digits,maximumFractionDigits:digits});
function getSetReward(n){if(n<=0)return 0;let reward=2000,keepCount=0;for(let i=1;i<=n;i++){if(i===1)reward=2000;else if(reward<20000&&keepCount===0){reward*=1.05;if(reward>=20000){reward=20000;keepCount=1}}else if(keepCount>0&&keepCount<5){reward=20000;keepCount++}else reward=Math.max(1000,reward*.975)}return reward}
const singleRewards=[],labels172=[];for(let i=1;i<=200;i++){const reward=getSetReward(i);singleRewards.push(Number(reward.toFixed(2)));labels172.push(`第 ${i} 套`);if(reward===1000&&i>=172)break}
let viewMode='single',selectedTierIndex=1,tiersDataCache=[],detailed90DaysData=[],pendingChartFrame=0,chartUpdateMode=null,fusionCostLineEnabled=false,anniversaryDays=7,midwayTotalPulls=58500;const FUSION_COST=8640,NORMAL_DAILY_PULLS=650,NORMAL_DAILY_COST=6000,ANNIVERSARY_EXTRA_PULLS=430,ANNIVERSARY_EXTRA_COST=4000,MIDWAY_BASE_PULLS=58500,MIDWAY_BASE_COST=540000,DAYS=90;
const ctx=$('rewardChart').getContext('2d');const chart=new Chart(ctx,{type:'line',data:{labels:[],datasets:[]},options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},plugins:{legend:{display:false},tooltip:{backgroundColor:COLORS.tooltip,titleColor:'#fff',bodyColor:'#eef2ff',borderColor:'#334155',borderWidth:1,padding:12,boxPadding:6},zoom:{pan:{enabled:true,mode:'x'},zoom:{wheel:{enabled:true},pinch:{enabled:true},mode:'x'}},annotation:{annotations:{}}},scales:{x:{grid:{color:COLORS.grid},ticks:{color:COLORS.tick,maxTicksLimit:25}},y:{grid:{color:COLORS.grid},ticks:{color:COLORS.tick,callback:value=>'$'+Number(value).toLocaleString()}}}}});
function findFusionCostIntervals(){const intervals=[];let start=null;singleRewards.forEach((reward,index)=>{if(reward>FUSION_COST){if(start===null)start=index}else if(start!==null){intervals.push({start:start+1,end:index,count:index-start});start=null}});if(start!==null)intervals.push({start:start+1,end:singleRewards.length,count:singleRewards.length-start});return intervals}
function findStopLines(cost){let line1=null,line2=null;for(let i=0;i<singleRewards.length;i++)if(singleRewards[i]>=cost){line1=i+1;break}for(let i=singleRewards.length-1;i>=0;i--)if(singleRewards[i]>=cost){line2=i+1;break}return{line1,line2}}
function markerXAdjust(context,index,otherIndex,direction){const chart=context.chart,area=chart.chartArea,scale=chart.scales.x;if(!area||!scale)return 0;const pixel=scale.getPixelForValue(index),otherPixel=scale.getPixelForValue(otherIndex),halfWidth=43,minGap=92;let target=pixel;if(Math.abs(otherPixel-pixel)<minGap)target+=direction*(minGap-Math.abs(otherPixel-pixel))/2;target=Math.max(area.left+halfWidth,Math.min(area.right-halfWidth,target));return target-pixel}
function markerYAdjust(context,value,index,otherIndex,direction){const chart=context.chart,area=chart.chartArea,xScale=chart.scales.x,yScale=chart.scales.y;if(!area||!xScale||!yScale)return-22;const pixel=yScale.getPixelForValue(value),close=Math.abs(xScale.getPixelForValue(index)-xScale.getPixelForValue(otherIndex))<92,halfHeight=15;let adjust=close?direction*22:-22;if(pixel+adjust-halfHeight<area.top)adjust=22;if(pixel+adjust+halfHeight>area.bottom)adjust=-22;return adjust}
const RANGE_MIN=.1,RANGE_MAX=3;function syncProbabilityRange(percent){const slider=$('probabilityRange');const value=Math.min(RANGE_MAX,Math.max(RANGE_MIN,percent));slider.value=value.toFixed(2);slider.setAttribute('aria-valuetext',percent.toFixed(3)+'%')}
function clearPresetActive(){document.querySelectorAll('.preset-btn').forEach(button=>{button.classList.remove('active');button.setAttribute('aria-pressed','false')})}
function applyPreset(probability,button){clearPresetActive();button.classList.add('active');button.setAttribute('aria-pressed','true');$('totalPulls').value=10000;$('orangeCards').value=Math.round(10000*(probability/100));syncProbabilityRange(probability);calculate()}
function renderTiers(){const html=tiersDataCache.map((tier,index)=>{const active=index===selectedTierIndex,midway=tier.isMidway,anniversary=tier.isAnniversary,cardClass=midway?'tier-card--midway ':anniversary?'tier-card--anniversary ':'';return `${midway?'<div':'<label'} class="tier-card ${cardClass}${active?'active':''}"><input type="radio" id="tier-${index}" name="tier" value="${index}" ${active?'checked':''}>${midway?`<label class="tier-select-label" for="tier-${index}" aria-label="选择中途上车档"></label>`:''}<span class="tier-selected">已选择</span><p class="tier-name">${tier.name}</p>${anniversary?`<div class="anniversary-input"><span>加抽</span><input type="number" id="anniversaryDays" value="${anniversaryDays}" min="0" max="90" step="1" inputmode="numeric" aria-label="周年庆加抽天数"><span>天</span></div>`:''}${midway?`<div class="midway-input"><span>90 天合计</span><input type="number" id="midwayTotalPulls" value="${midwayTotalPulls}" min="1" step="1" inputmode="decimal" aria-label="中途上车档 90 天合计抽数"><span>抽</span></div>`:''}<p class="tier-cost-label">预估单套成本</p><div class="tier-cost">${money(tier.realCost)} <small>/ 套</small></div><p class="tier-output">${midway?`90 天总成本 <strong>${money(tier.totalCost,0)}</strong> · 日均 <strong>${tier.pulls.toFixed(2)}</strong> 抽`:anniversary?`基础 650 抽 × 90 天 · 加抽 430 抽 × <strong>${anniversaryDays}</strong> 天`:`每日可得 <strong>${tier.orangeCount.toFixed(2)}</strong> 张橙卡 · <strong>${tier.setNum.toFixed(2)}</strong> 套`}</p><p class="tier-total">90 天预计获得橙卡 <strong>${(tier.orangeCount*DAYS).toFixed(2)}</strong> 张，可成 <strong>${Math.floor(tier.orangeCount*DAYS/6)}</strong> 套</p>${midway?'</div>':'</label>'}`}).join('');$('tiersContainer').innerHTML=html}
function calculate(renderChart=true){const totalPulls=parseFloat($('totalPulls').value),orangeCards=parseFloat($('orangeCards').value),message=$('formMessage');if(!Number.isFinite(totalPulls)||totalPulls<=0){message.textContent='总抽数需要是大于 0 的有效数值。';return}if(!Number.isFinite(orangeCards)||orangeCards<0){message.textContent='橙卡数不能小于 0。';return}if(!Number.isInteger(anniversaryDays)||anniversaryDays<0||anniversaryDays>DAYS){message.textContent='周年庆加抽天数需要是 0 至 90 的整数。';return}if(!Number.isFinite(midwayTotalPulls)||midwayTotalPulls<=0){message.textContent='中途上车档的 90 天合计抽数需要大于 0。';return}message.textContent='';const prob=orangeCards/totalPulls;const probPercent=prob*100;$('probVal').textContent=probPercent.toFixed(3)+'%';syncProbabilityRange(probPercent);const anniversaryTotalPulls=NORMAL_DAILY_PULLS*DAYS+ANNIVERSARY_EXTRA_PULLS*anniversaryDays,anniversaryTotalCost=NORMAL_DAILY_COST*DAYS+ANNIVERSARY_EXTRA_COST*anniversaryDays,midwayTotalCost=midwayTotalPulls/MIDWAY_BASE_PULLS*MIDWAY_BASE_COST;const tiers=[{name:'正常满抽 650次',pulls:NORMAL_DAILY_PULLS,baseCost:NORMAL_DAILY_COST},{name:'周年庆档',pulls:anniversaryTotalPulls/DAYS,baseCost:anniversaryTotalCost/DAYS,totalPulls:anniversaryTotalPulls,totalCost:anniversaryTotalCost,isAnniversary:true},{name:'中途上车档',pulls:midwayTotalPulls/DAYS,baseCost:midwayTotalCost/DAYS,totalPulls:midwayTotalPulls,totalCost:midwayTotalCost,isMidway:true}];tiersDataCache=tiers.map(tier=>{const orangeCount=tier.pulls*prob,setNum=orangeCount/6,realCost=setNum>0?tier.baseCost/setNum:0;return{...tier,orangeCount,setNum,prob,realCost,...findStopLines(realCost)}});renderTiers();if(renderChart)updateChartDisplay()}
function selectTier(index){selectedTierIndex=index;if(pendingChartFrame){cancelAnimationFrame(pendingChartFrame);pendingChartFrame=0}renderTiers();updateChartDisplay()}
function updateModeControls(){const single=viewMode==='single';$('btnModeSingle').classList.toggle('active',single);$('btnMode90Days').classList.toggle('active',!single);$('btnModeSingle').setAttribute('aria-selected',String(single));$('btnMode90Days').setAttribute('aria-selected',String(!single));const toggle=$('fusionCostToggle'),wrap=$('fusionToggleWrap');if(toggle){toggle.checked=fusionCostLineEnabled;toggle.disabled=!single;toggle.setAttribute('aria-label',single?'显示溶合成本线':'溶合成本线仅适用于单套兑换');wrap.classList.toggle('fusion-toggle--disabled',!single)}}
function switchMode(mode){viewMode=mode;updateModeControls();updateChartDisplay()}
function updateChartDisplay(updateMode=null){const tier=tiersDataCache[selectedTierIndex];if(!tier)return;chartUpdateMode=updateMode;viewMode==='single'?renderSingleView(tier):render90DaysView(tier);chartUpdateMode=null}
function commitChartUpdate(){chartUpdateMode==='none'||chartUpdateMode==='none-aux'?chart.update('none'):chart.update()}
function scheduleSliderChartUpdate(){if(pendingChartFrame)return;pendingChartFrame=requestAnimationFrame(()=>{pendingChartFrame=0;updateChartDisplay('none')})}
function flushSliderChartUpdate(){if(pendingChartFrame){cancelAnimationFrame(pendingChartFrame);pendingChartFrame=0}updateChartDisplay('none-aux')}
function renderLegend(items,insight,amber=false){$('legendBar').innerHTML=`<ul class="legend-group">${items.map(item=>`<li class="legend-item"><span class="dot dot--${item.color}" aria-hidden="true"></span>${item.text}</li>`).join('')}</ul><div class="insight ${amber?'insight--amber':''}">${insight}</div>`;updateModeControls()}
function renderTable(headers,rows){$('dataTable').innerHTML=`<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function renderSingleView(tier){$('chartTitle').textContent='单套成本与兑付曲线';$('analysisContext').textContent=`${tier.name} · 单套兑换分析`;$('analysisMetric').textContent=`预估每套成本 ${money(tier.realCost)}；可盈利兑换范围：第 ${tier.line1||'-'} 套至第 ${tier.line2||'-'} 套。`;chart.data.labels=labels172;chart.data.datasets=[{label:'单套兑付金额',data:singleRewards,borderColor:COLORS.green,borderWidth:2.5,pointRadius:0,pointHoverRadius:6,tension:.15,segment:{borderColor:segment=>{const value=segment.p0.parsed.y,index=segment.p0DataIndex;if(value>=20000)return COLORS.amber;if(index>=53)return value<=1000?COLORS.slate:COLORS.red;return COLORS.green}}}];chart.options.plugins.tooltip.callbacks={title:items=>items[0].label,label:item=>{const sum=singleRewards.slice(0,item.dataIndex+1).reduce((a,b)=>a+b,0);return[`兑换奖励: ${money(item.raw)}`,`累计奖励: ${money(sum)}`]}};const annotations={};const fusionIntervals=fusionCostLineEnabled?findFusionCostIntervals():[];if(fusionCostLineEnabled){fusionIntervals.forEach((interval,index)=>{annotations[`fusionProfitZone${index}`]={type:'box',xMin:interval.start-1,xMax:interval.end-1,backgroundColor:'rgba(180,83,9,.12)',borderColor:'rgba(180,83,9,.32)',borderWidth:1,borderDash:[4,4]}});annotations.fusionCostLine={type:'line',yMin:FUSION_COST,yMax:FUSION_COST,borderColor:COLORS.amber,borderWidth:2,borderDash:[8,4],label:{display:true,content:`溶合成本线: ${money(FUSION_COST,0)}`,position:'end',backgroundColor:'#fff7e8',color:COLORS.amber,font:{size:11,weight:'bold'}}}}if(tier.line1&&tier.line2&&tier.line1<=tier.line2){annotations.profitZone={type:'box',xMin:tier.line1-1,xMax:tier.line2-1,backgroundColor:'rgba(15,155,122,.12)',borderWidth:0};annotations.costLine={type:'line',yMin:tier.realCost,yMax:tier.realCost,borderColor:'#94a3b8',borderWidth:1.5,borderDash:[4,4],label:{display:true,content:`单套成本: ${money(tier.realCost)}`,position:'start',backgroundColor:'#fff',color:'#475569',font:{size:11}}};annotations.profitStartMarker={type:'label',xValue:tier.line1-1,yValue:singleRewards[tier.line1-1],content:`✅ ${tier.line1}套`,position:'center',xAdjust:context=>markerXAdjust(context,tier.line1-1,tier.line2-1,-1),yAdjust:context=>markerYAdjust(context,singleRewards[tier.line1-1],tier.line1-1,tier.line2-1,1),backgroundColor:'rgba(255,255,255,.94)',color:'#087f5b',font:{size:13,weight:'bold'},padding:{x:7,y:4},borderColor:'rgba(15,155,122,.38)',borderWidth:1,borderRadius:6};annotations.profitEndMarker={type:'label',xValue:tier.line2-1,yValue:singleRewards[tier.line2-1],content:`❌ ${tier.line2}套`,position:'center',xAdjust:context=>markerXAdjust(context,tier.line2-1,tier.line1-1,1),yAdjust:context=>markerYAdjust(context,singleRewards[tier.line2-1],tier.line2-1,tier.line1-1,-1),backgroundColor:'rgba(255,255,255,.94)',color:'#c92a2a',font:{size:13,weight:'bold'},padding:{x:7,y:4},borderColor:'rgba(214,69,69,.38)',borderWidth:1,borderRadius:6}}chart.options.plugins.annotation.annotations=annotations;commitChartUpdate();if(chartUpdateMode==='none')return;const fusionInsight=fusionCostLineEnabled?` · 溶合成本 ${money(FUSION_COST,0)}：${fusionIntervals.map(interval=>`第 ${interval.start}–${interval.end} 套（共 ${interval.count} 套）`).join('；')}`:'';renderLegend([{color:'green',text:'1-48递增期5%'},{color:'amber',text:'49-54封顶保持期（$20,000）'},{color:'red',text:'55-171衰减期2.5%'},{color:'slate',text:'172套保底锁死（$1,000）'}],`盈利区间：第 ${tier.line1||'-'} 套至第 ${tier.line2||'-'} 套${fusionInsight}`);renderTable(['兑换套数','单套奖励','累计奖励'],singleRewards.map((reward,index)=>[`第 ${index+1} 套`,money(reward),money(singleRewards.slice(0,index+1).reduce((a,b)=>a+b,0))]))}
function render90DaysView(tier){$('chartTitle').textContent='90 天累计投入与收益';$('analysisContext').textContent=`当前为 ${tier.name} 的 90 天累计分析`; const labels=[],costs=[],rewards=[],profits=[];detailed90DaysData=[];let cumulativeCost=0,cumulativeSets=0,redeemed=0,totalReward=0,maxProfit=-Infinity,maxDay=1,breakEvenDay=null;const dailySets=tier.pulls*tier.prob/6;for(let day=1;day<=DAYS;day++){labels.push(`第 ${day} 天`);cumulativeCost+=tier.baseCost;cumulativeSets+=dailySets;const integerSets=Math.floor(cumulativeSets);while(redeemed<integerSets){redeemed++;totalReward+=getSetReward(redeemed)}const netProfit=totalReward-cumulativeCost;costs.push(cumulativeCost);rewards.push(Number(totalReward.toFixed(2)));profits.push(Number(netProfit.toFixed(2)));detailed90DaysData.push({day,cumCost:cumulativeCost,cumSets:cumulativeSets.toFixed(2),integerSets,lastSetReward:integerSets?getSetReward(integerSets):0,cumReward:totalReward,netProfit});if(breakEvenDay===null&&netProfit>=0)breakEvenDay=day;if(netProfit>maxProfit){maxProfit=netProfit;maxDay=day}}chart.data.labels=labels;chart.data.datasets=[{label:'累计投入成本',data:costs,borderColor:COLORS.red,borderWidth:2,borderDash:[5,5],pointRadius:0,tension:0},{label:'累计兑奖收益',data:rewards,borderColor:COLORS.blue,borderWidth:2.5,pointRadius:0,pointHoverRadius:6,tension:.1},{label:'累计净利润',data:profits,borderColor:COLORS.green,borderWidth:2,backgroundColor:'rgba(15,155,122,.12)',fill:true,pointRadius:context=>context.dataIndex===maxDay-1?7:0,pointBackgroundColor:COLORS.amber,pointBorderColor:'#fff',pointBorderWidth:2,tension:.1}];chart.options.plugins.tooltip.callbacks={title:items=>`第 ${items[0].dataIndex+1} 天`,label:item=>{if(item.datasetIndex!==0)return null;const d=detailed90DaysData[item.dataIndex];return[`累计成本: ${money(d.cumCost,0)}`,`合计成套: ${d.cumSets} 套`,`第 ${d.integerSets} 套奖励: ${money(d.lastSetReward,0)}`,`累计兑奖收益: ${money(d.cumReward)}`,`当前净利润: ${d.netProfit>=0?'+':'-'}${money(Math.abs(d.netProfit))}`]}};const annotations={maxProfitLine:{type:'line',xMin:maxDay-1,xMax:maxDay-1,borderColor:COLORS.amber,borderWidth:2,borderDash:[3,3],label:{display:true,content:[`最大利润点：第 ${maxDay} 天`,`最高净利润：+${money(maxProfit,0)}`],position:'top',backgroundColor:COLORS.amber,color:'#fff',font:{size:11,weight:'bold'},padding:6,borderRadius:6}}};if(breakEvenDay!==null)annotations.breakEvenLine={type:'line',xMin:breakEvenDay-1,xMax:breakEvenDay-1,borderColor:COLORS.green,borderWidth:2,borderDash:[4,4],label:{display:true,content:`扭亏为盈：第 ${breakEvenDay} 天`,position:'start',backgroundColor:COLORS.green,color:'#fff',font:{size:11,weight:'bold'},padding:6,borderRadius:6}};chart.options.plugins.annotation.annotations=annotations;commitChartUpdate();if(chartUpdateMode==='none')return;$('analysisMetric').textContent=`每日投入 ${money(tier.baseCost,0)}；第 ${maxDay} 天达到最高净利润 +${money(maxProfit)}。`;renderLegend([{color:'blue',text:'累计兑奖收益'},{color:'red',text:`累计投入成本（${money(tier.baseCost,0)}/天，虚线）`},{color:'green',text:'累计净利润'}],`建议在第 ${maxDay} 天止盈，最高净利润为 +${money(maxProfit)}`,true);renderTable(['天数','累计成本','合计成套','累计收益','净利润'],detailed90DaysData.map(d=>[`第 ${d.day} 天`,money(d.cumCost,0),d.cumSets,money(d.cumReward),`${d.netProfit>=0?'+':'-'}${money(Math.abs(d.netProfit))}`]))}
$('probabilityRange').addEventListener('input',event=>{const totalPulls=parseFloat($('totalPulls').value);if(!Number.isFinite(totalPulls)||totalPulls<=0){calculate();return}clearPresetActive();$('orangeCards').value=(totalPulls*Number(event.target.value)/100).toFixed(4).replace(/\.?0+$/,'');calculate(false);scheduleSliderChartUpdate()});$('probabilityRange').addEventListener('change',flushSliderChartUpdate);$('totalPulls').addEventListener('input',()=>{clearPresetActive();calculate()});$('orangeCards').addEventListener('input',()=>{clearPresetActive();calculate()});$('presetGroup').addEventListener('click',event=>{const button=event.target.closest('.preset-btn');if(button)applyPreset(Number(button.dataset.probability),button)});$('tiersContainer').addEventListener('change',event=>{if(event.target.name==='tier')selectTier(Number(event.target.value));if(event.target.id==='anniversaryDays'){const value=Number(event.target.value);if(!Number.isInteger(value)||value<0||value>DAYS){$('formMessage').textContent='周年庆加抽天数需要是 0 至 90 的整数。';event.target.value=anniversaryDays;return}anniversaryDays=value;selectedTierIndex=1;calculate()}if(event.target.id==='midwayTotalPulls'){const value=parseFloat(event.target.value);if(!Number.isFinite(value)||value<=0){$('formMessage').textContent='中途上车档的 90 天合计抽数需要大于 0。';event.target.value=midwayTotalPulls;return}midwayTotalPulls=value;selectedTierIndex=2;calculate()}});$('fusionCostToggle').addEventListener('change',event=>{fusionCostLineEnabled=event.target.checked;updateChartDisplay()});$('btnModeSingle').addEventListener('click',()=>switchMode('single'));$('btnMode90Days').addEventListener('click',()=>switchMode('90days'));$('resetZoom').addEventListener('click',()=>{if(typeof chart.resetZoom==='function')chart.resetZoom()});calculate();
</script>
