<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="根据抽卡概率，分析兑换成本、单套奖励与 90 天累计收益。">
  <title>兑奖收益分析台</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <style>
    :root { --page:#f5f7fb; --surface:#fff; --surface-alt:#f8fafc; --line:#dfe6f0; --ink:#172033; --muted:#64748b; --blue:#2563eb; --blue-soft:#eff6ff; --green:#0f9b7a; --green-soft:#eaf8f3; --amber:#b45309; --amber-soft:#fff7e8; --red:#d64545; --red-soft:#fff0f0; --slate:#52657a; --radius:16px; --shadow:0 18px 42px -30px rgba(19,35,64,.42); --focus:0 0 0 3px rgba(37,99,235,.22); }
    * { box-sizing:border-box; } body { margin:0; min-width:320px; background:radial-gradient(circle at top right,#e8efff 0,transparent 31rem),var(--page); color:var(--ink); font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input { font:inherit; } button { cursor:pointer; } button:focus-visible,input:focus-visible,summary:focus-visible { outline:none; box-shadow:var(--focus); }
    .shell { max-width:1440px; margin:auto; padding:28px 20px 40px; } .app-header { display:flex; align-items:end; justify-content:space-between; gap:24px; margin:4px 0 22px; } .eyebrow { margin:0 0 6px; color:var(--blue); font-size:12px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; } h1 { margin:0; font-size:clamp(26px,4vw,38px); line-height:1.15; letter-spacing:-.04em; } .subtitle { max-width:560px; margin:10px 0 0; color:var(--muted); } .workflow { display:flex; gap:8px; color:var(--muted); font-size:12px; font-weight:700; white-space:nowrap; } .workflow span { display:flex; align-items:center; gap:6px; } .workflow i { width:20px; height:20px; display:grid; place-items:center; border-radius:50%; background:var(--blue-soft); color:var(--blue); font-style:normal; }
    .dashboard { display:grid; gap:18px; } .overview { display:grid; grid-template-columns:minmax(360px,.9fr) minmax(500px,1.5fr); gap:18px; } .panel { min-width:0; padding:22px; background:var(--surface); border:1px solid rgba(207,217,232,.85); border-radius:var(--radius); box-shadow:var(--shadow); } .panel-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; } .panel-heading h2 { margin:0; font-size:16px; letter-spacing:-.02em; } .panel-heading p { margin:3px 0 0; color:var(--muted); font-size:12px; } .step { display:grid; place-items:center; width:25px; height:25px; flex:none; border-radius:8px; background:var(--blue-soft); color:var(--blue); font-size:12px; font-weight:800; }
    fieldset { min-width:0; margin:0; padding:0; border:0; } legend { padding:0; color:var(--muted); font-size:12px; font-weight:700; } .input-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px; } .input-field label { display:block; margin:0 0 6px; color:var(--muted); font-size:12px; font-weight:700; } .input-field input { width:100%; min-height:44px; padding:10px 12px; color:var(--ink); font-weight:700; background:var(--surface-alt); border:1px solid var(--line); border-radius:10px; transition:border-color .2s,background .2s; } .input-field input:focus { border-color:var(--blue); background:#fff; }
    .probability { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:16px 0; padding:13px 14px; color:#1647ad; background:var(--blue-soft); border:1px solid #cfe0ff; border-radius:12px; } .probability__label { font-size:12px; font-weight:700; } .probability output { font-size:21px; font-weight:850; letter-spacing:-.04em; } .form-message { min-height:18px; margin:8px 0 0; color:var(--red); font-size:12px; font-weight:650; }
    .preset-label { margin:0 0 8px; color:var(--muted); font-size:12px; font-weight:700; } .preset-group { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; } .preset-btn { min-height:38px; padding:5px 4px; color:var(--muted); font-size:12px; font-weight:750; white-space:nowrap; background:var(--surface-alt); border:1px solid var(--line); border-radius:9px; transition:.2s; } .preset-btn:hover { color:var(--blue); border-color:#a8c4ff; background:var(--blue-soft); } .preset-btn.active { color:#fff; background:var(--blue); border-color:var(--blue); }
    .tiers-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; } .tier-card { position:relative; display:block; min-height:184px; padding:16px; background:var(--surface-alt); border:1px solid var(--line); border-radius:13px; cursor:pointer; transition:transform .2s,border-color .2s,box-shadow .2s,background .2s; } .tier-card:hover { transform:translateY(-2px); border-color:#a9bce0; } .tier-card:has(input:focus-visible) { box-shadow:var(--focus); } .tier-card.active { background:#fff; border:2px solid var(--blue); box-shadow:0 12px 24px -22px rgba(37,99,235,.9); } .tier-card input { position:absolute; opacity:0; pointer-events:none; } .tier-selected { position:absolute; top:13px; right:13px; display:none; padding:2px 7px; color:var(--blue); background:var(--blue-soft); border-radius:99px; font-size:10px; font-weight:800; } .tier-card.active .tier-selected { display:block; } .tier-name { max-width:82%; margin:0; font-size:13px; font-weight:800; } .tier-cost-label { margin:14px 0 1px; color:var(--muted); font-size:11px; font-weight:700; } .tier-cost { color:var(--amber); font-size:24px; font-weight:850; letter-spacing:-.04em; } .tier-cost small { color:var(--muted); font-size:11px; font-weight:700; } .tier-output { margin:12px 0; color:var(--muted); font-size:12px; } .tier-output strong { color:var(--ink); } .thresholds { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding-top:10px; border-top:1px dashed #cbd5e1; } .threshold { color:var(--muted); font-size:11px; } .threshold b { display:block; margin-top:2px; font-size:12px; } .threshold--profit b { color:var(--green); } .threshold--loss b { color:var(--red); }
    .analysis-panel { padding:22px; } .analysis-top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px; } .analysis-title { margin:0; font-size:clamp(17px,2vw,21px); letter-spacing:-.03em; } .analysis-context { margin:5px 0 0; color:var(--muted); font-size:12px; } .analysis-actions { display:flex; align-items:center; flex-wrap:wrap; justify-content:flex-end; gap:9px; } .mode-switch { display:inline-flex; padding:3px; background:var(--surface-alt); border:1px solid var(--line); border-radius:11px; } .mode-btn { min-height:38px; padding:7px 11px; color:var(--muted); font-size:12px; font-weight:750; background:transparent; border:0; border-radius:8px; } .mode-btn.active { color:var(--blue); background:#fff; box-shadow:0 2px 7px rgba(20,40,70,.1); } .ghost-btn { min-height:38px; padding:7px 10px; color:var(--muted); font-size:12px; font-weight:700; background:#fff; border:1px solid var(--line); border-radius:9px; } .ghost-btn:hover { color:var(--blue); border-color:#a9bce0; } .chart-tip { margin:0 0 12px; color:var(--muted); font-size:12px; } .chart-container { position:relative; height:clamp(350px,48vw,580px); padding:10px 4px 0; } canvas { max-width:100%; }
    .legend-bar { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center; margin-top:14px; padding:15px 0 0; border-top:1px solid var(--line); } .legend-group { display:flex; flex-wrap:wrap; gap:10px 15px; margin:0; padding:0; list-style:none; } .legend-item { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; font-weight:650; } .dot { width:9px; height:9px; flex:none; border-radius:50%; } .dot--blue{background:var(--blue)} .dot--green{background:var(--green)} .dot--amber{background:var(--amber)} .dot--red{background:var(--red)} .dot--slate{background:var(--slate)} .insight { max-width:530px; padding:8px 11px; color:#16634f; background:var(--green-soft); border-radius:9px; font-size:12px; font-weight:750; } .insight--amber { color:#8a4708; background:var(--amber-soft); }
    .accessible-summary { margin:14px 0 0; color:var(--muted); font-size:12px; } details { margin-top:13px; background:var(--surface-alt); border:1px solid var(--line); border-radius:10px; } summary { padding:10px 12px; color:var(--ink); font-size:12px; font-weight:750; cursor:pointer; } .table-wrap { overflow-x:auto; padding:0 12px 12px; } table { width:100%; min-width:560px; border-collapse:collapse; font-size:12px; } th,td { padding:8px 10px; text-align:right; border-top:1px solid var(--line); } th { color:var(--muted); font-weight:750; } th:first-child,td:first-child { text-align:left; }
    @media (max-width:1050px) { .overview{grid-template-columns:1fr}.app-header{align-items:flex-start;flex-direction:column}.workflow{order:-1} } @media (max-width:620px) { .shell{padding:20px 14px 28px}.panel,.analysis-panel{padding:16px}.workflow{flex-wrap:wrap;white-space:normal}.preset-group{grid-template-columns:repeat(4,1fr)}.analysis-top{flex-direction:column}.analysis-actions{justify-content:flex-start;width:100%}.mode-switch{width:100%}.mode-btn{flex:1;padding-inline:7px}.legend-bar{grid-template-columns:1fr}.insight{max-width:none}.chart-container{height:350px}.tiers-grid{grid-template-columns:1fr}.tier-card{min-height:168px} } @media (max-width:390px) {.input-grid{grid-template-columns:1fr}.preset-group{grid-template-columns:repeat(3,1fr)}} @media (prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}} @media (forced-colors:active){.tier-card.active,.preset-btn.active,.mode-btn.active{outline:2px solid Highlight;outline-offset:2px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="app-header"><div><p class="eyebrow">Reward intelligence</p><h1>兑奖收益分析台</h1><p class="subtitle">用实际出橙概率，快速比较抽卡成本、兑换节奏与 90 天累计收益。</p></div><div class="workflow" aria-label="使用流程"><span><i>1</i>配置数据</span><span><i>2</i>选择档位</span><span><i>3</i>分析收益</span></div></header>
    <div class="dashboard">
      <div class="overview">
        <section class="panel" aria-labelledby="inputs-title"><div class="panel-heading"><div><h2 id="inputs-title">配置抽卡数据</h2><p>输入历史抽卡结果，或使用快速概率预设。</p></div><span class="step">01</span></div>
          <form id="calculatorForm" novalidate><fieldset><legend>抽卡数据</legend><div class="input-grid"><div class="input-field"><label for="totalPulls">总抽数</label><input type="number" id="totalPulls" value="10000" min="1" step="1" inputmode="decimal"></div><div class="input-field"><label for="orangeCards">橙卡数</label><input type="number" id="orangeCards" value="100" min="0" step="1" inputmode="decimal"></div></div></fieldset><p class="form-message" id="formMessage" role="alert"></p></form>
          <div class="probability" aria-live="polite"><span class="probability__label">当前出橙概率</span><output id="probVal">1.000%</output></div>
          <p class="preset-label">快速概率预设</p><div class="preset-group" id="presetGroup" aria-label="快速概率预设"><button type="button" class="preset-btn" data-probability="0.5" data-name="非酋" aria-pressed="false">非酋 0.5%</button><button type="button" class="preset-btn" data-probability="0.8" data-name="小黑" aria-pressed="false">小黑 0.8%</button><button type="button" class="preset-btn" data-probability="0.9" data-name="稍黑" aria-pressed="false">稍黑 0.9%</button><button type="button" class="preset-btn active" data-probability="1" data-name="标准" aria-pressed="true">标准 1%</button><button type="button" class="preset-btn" data-probability="1.1" data-name="稍欧" aria-pressed="false">稍欧 1.1%</button><button type="button" class="preset-btn" data-probability="1.2" data-name="小欧" aria-pressed="false">小欧 1.2%</button><button type="button" class="preset-btn" data-probability="1.5" data-name="欧皇" aria-pressed="false">欧皇 1.5%</button></div>
        </section>
        <section class="panel" aria-labelledby="tiers-title"><div class="panel-heading"><div><h2 id="tiers-title">比较成本档位</h2><p>选择一个档位，下方图表会同步更新。</p></div><span class="step">02</span></div><div class="tiers-grid" id="tiersContainer" role="radiogroup" aria-label="成本档位"></div></section>
      </div>
      <section class="panel analysis-panel" aria-labelledby="analysis-title"><div class="analysis-top"><div><h2 class="analysis-title" id="chartTitle">收益综合分析</h2><p class="analysis-context" id="analysisContext">选择档位后查看完整数据</p></div><div class="analysis-actions"><div class="mode-switch" role="tablist" aria-label="分析视角"><button class="mode-btn active" id="btnModeSingle" type="button" role="tab" aria-selected="true">单套兑换</button><button class="mode-btn" id="btnMode90Days" type="button" role="tab" aria-selected="false">90 天累计</button></div><button class="ghost-btn" id="resetZoom" type="button">重置缩放</button></div></div><p class="chart-tip">滚轮或双指缩放，拖拽平移；悬停数据点查看详细数值。</p><figure class="analysis-figure"><div class="chart-container"><canvas id="rewardChart" role="img" aria-label="兑奖收益数据图表"></canvas></div><figcaption class="accessible-summary" id="chartSummary"></figcaption></figure><div class="legend-bar" id="legendBar"></div><details><summary>查看当前分析的明细数据</summary><div class="table-wrap" id="dataTable"></div></details></section>
    </div>
  </main>
<script>
const COLORS={blue:'#2563eb',green:'#0f9b7a',amber:'#b45309',red:'#d64545',slate:'#52657a',grid:'#e8edf5',tick:'#64748b',tooltip:'#172033'};
const $=id=>document.getElementById(id); const money=(value,digits=2)=>'$'+Number(value).toLocaleString(undefined,{minimumFractionDigits:digits,maximumFractionDigits:digits});
function getSetReward(n){if(n<=0)return 0;let reward=2000,keepCount=0;for(let i=1;i<=n;i++){if(i===1)reward=2000;else if(reward<20000&&keepCount===0){reward*=1.05;if(reward>=20000){reward=20000;keepCount=1}}else if(keepCount>0&&keepCount<5){reward=20000;keepCount++}else reward=Math.max(1000,reward*.975)}return reward}
const singleRewards=[],labels172=[];for(let i=1;i<=200;i++){const reward=getSetReward(i);singleRewards.push(Number(reward.toFixed(2)));labels172.push(`第 ${i} 套`);if(reward===1000&&i>=172)break}
let viewMode='single',selectedTierIndex=1,tiersDataCache=[],detailed90DaysData=[];
const ctx=$('rewardChart').getContext('2d');const chart=new Chart(ctx,{type:'line',data:{labels:[],datasets:[]},options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},plugins:{legend:{display:false},tooltip:{backgroundColor:COLORS.tooltip,titleColor:'#fff',bodyColor:'#eef2ff',borderColor:'#334155',borderWidth:1,padding:12,boxPadding:6},zoom:{pan:{enabled:true,mode:'x'},zoom:{wheel:{enabled:true},pinch:{enabled:true},mode:'x'}},annotation:{annotations:{}}},scales:{x:{grid:{color:COLORS.grid},ticks:{color:COLORS.tick,maxTicksLimit:25}},y:{grid:{color:COLORS.grid},ticks:{color:COLORS.tick,callback:value=>'$'+Number(value).toLocaleString()}}}}});
function findStopLines(cost){let line1=null,line2=null;for(let i=0;i<singleRewards.length;i++)if(singleRewards[i]>=cost){line1=i+1;break}for(let i=singleRewards.length-1;i>=0;i--)if(singleRewards[i]>=cost){line2=i+1;break}return{line1,line2}}
function clearPresetActive(){document.querySelectorAll('.preset-btn').forEach(button=>{button.classList.remove('active');button.setAttribute('aria-pressed','false')})}
function applyPreset(probability,button){clearPresetActive();button.classList.add('active');button.setAttribute('aria-pressed','true');$('totalPulls').value=10000;$('orangeCards').value=Math.round(10000*(probability/100));calculate()}
function renderTiers(){const html=tiersDataCache.map((tier,index)=>{const active=index===selectedTierIndex;return `<label class="tier-card ${active?'active':''}"><input type="radio" name="tier" value="${index}" ${active?'checked':''}><span class="tier-selected">已选择</span><p class="tier-name">${tier.name}</p><p class="tier-cost-label">预估单套成本</p><div class="tier-cost">${money(tier.realCost)} <small>/ 套</small></div><p class="tier-output">每日可得 <strong>${tier.orangeCount.toFixed(2)}</strong> 张橙卡 · <strong>${tier.setNum.toFixed(2)}</strong> 套</p><div class="thresholds"><div class="threshold threshold--profit">起盈线<b>${tier.line1?'第 '+tier.line1+' 套':'无法回本'}</b></div><div class="threshold threshold--loss">止损线<b>${tier.line2?'第 '+tier.line2+' 套':'无法回本'}</b></div></div></label>`}).join('');$('tiersContainer').innerHTML=html}
function calculate(){const totalPulls=parseFloat($('totalPulls').value),orangeCards=parseFloat($('orangeCards').value),message=$('formMessage');if(!Number.isFinite(totalPulls)||totalPulls<=0){message.textContent='总抽数需要是大于 0 的有效数值。';return}if(!Number.isFinite(orangeCards)||orangeCards<0){message.textContent='橙卡数不能小于 0。';return}message.textContent='';const prob=orangeCards/totalPulls;$('probVal').textContent=(prob*100).toFixed(3)+'%';const tiers=[{name:'档位 1 · 正常满抽 650',pulls:650,baseCost:6000},{name:'档位 2 · 周年满抽 1080',pulls:1080,baseCost:10000}];tiersDataCache=tiers.map(tier=>{const orangeCount=tier.pulls*prob,setNum=orangeCount/6,realCost=setNum>0?tier.baseCost/setNum:0;return{...tier,orangeCount,setNum,prob,realCost,...findStopLines(realCost)}});renderTiers();updateChartDisplay()}
function selectTier(index){selectedTierIndex=index;renderTiers();updateChartDisplay()}
function updateModeControls(){const single=viewMode==='single';$('btnModeSingle').classList.toggle('active',single);$('btnMode90Days').classList.toggle('active',!single);$('btnModeSingle').setAttribute('aria-selected',String(single));$('btnMode90Days').setAttribute('aria-selected',String(!single))}
function switchMode(mode){viewMode=mode;updateModeControls();updateChartDisplay()}
function updateChartDisplay(){const tier=tiersDataCache[selectedTierIndex];if(!tier)return;viewMode==='single'?renderSingleView(tier):render90DaysView(tier)}
function renderLegend(items,insight,amber=false){$('legendBar').innerHTML=`<ul class="legend-group">${items.map(item=>`<li class="legend-item"><span class="dot dot--${item.color}" aria-hidden="true"></span>${item.text}</li>`).join('')}</ul><div class="insight ${amber?'insight--amber':''}">${insight}</div>`}
function renderTable(headers,rows){$('dataTable').innerHTML=`<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function renderSingleView(tier){$('chartTitle').textContent='单套成本与兑付曲线';$('analysisContext').textContent=`${tier.name} · 单套成本 ${money(tier.realCost)}`;chart.data.labels=labels172;chart.data.datasets=[{label:'单套兑付金额',data:singleRewards,borderColor:COLORS.green,borderWidth:2.5,pointRadius:0,pointHoverRadius:6,tension:.15,segment:{borderColor:segment=>{const value=segment.p0.parsed.y,index=segment.p0DataIndex;if(value>=20000)return COLORS.amber;if(index>=53)return value<=1000?COLORS.slate:COLORS.red;return COLORS.green}}}];chart.options.plugins.tooltip.callbacks={title:items=>items[0].label,label:item=>{const sum=singleRewards.slice(0,item.dataIndex+1).reduce((a,b)=>a+b,0);return[`兑换奖励: ${money(item.raw)}`,`累计奖励: ${money(sum)}`]}};const annotations={};if(tier.line1&&tier.line2&&tier.line1<=tier.line2){annotations.profitZone={type:'box',xMin:tier.line1-1,xMax:tier.line2-1,backgroundColor:'rgba(15,155,122,.12)',borderWidth:0};annotations.costLine={type:'line',yMin:tier.realCost,yMax:tier.realCost,borderColor:'#94a3b8',borderWidth:1.5,borderDash:[4,4],label:{display:true,content:`单套成本: ${money(tier.realCost)}`,position:'start',backgroundColor:'#fff',color:'#475569',font:{size:11}}}}chart.options.plugins.annotation.annotations=annotations;chart.update();renderLegend([{color:'green',text:'递增期'},{color:'amber',text:'封顶保持期（$20,000）'},{color:'red',text:'衰减期'},{color:'slate',text:'保底锁死（$1,000）'}],`盈利区间：第 ${tier.line1||'-'} 套至第 ${tier.line2||'-'} 套`);$('chartSummary').textContent=`当前为 ${tier.name} 的单套分析。预估每套成本为 ${money(tier.realCost)}，可盈利兑换范围为第 ${tier.line1||'-'} 套至第 ${tier.line2||'-'} 套。`;renderTable(['兑换套数','单套奖励','累计奖励'],singleRewards.map((reward,index)=>[`第 ${index+1} 套`,money(reward),money(singleRewards.slice(0,index+1).reduce((a,b)=>a+b,0))]))}
function render90DaysView(tier){$('chartTitle').textContent='90 天累计投入与收益';$('analysisContext').textContent=`${tier.name} · 每日投入 ${money(tier.baseCost,0)}`;const labels=[],costs=[],rewards=[],profits=[];detailed90DaysData=[];let cumulativeCost=0,cumulativeSets=0,redeemed=0,totalReward=0,maxProfit=-Infinity,maxDay=1;const dailySets=tier.pulls*tier.prob/6;for(let day=1;day<=90;day++){labels.push(`第 ${day} 天`);cumulativeCost+=tier.baseCost;cumulativeSets+=dailySets;const integerSets=Math.floor(cumulativeSets);while(redeemed<integerSets){redeemed++;totalReward+=getSetReward(redeemed)}const netProfit=totalReward-cumulativeCost;costs.push(cumulativeCost);rewards.push(Number(totalReward.toFixed(2)));profits.push(Number(netProfit.toFixed(2)));detailed90DaysData.push({day,cumCost:cumulativeCost,cumSets:cumulativeSets.toFixed(2),integerSets,lastSetReward:integerSets?getSetReward(integerSets):0,cumReward:totalReward,netProfit});if(netProfit>maxProfit){maxProfit=netProfit;maxDay=day}}chart.data.labels=labels;chart.data.datasets=[{label:'累计投入成本',data:costs,borderColor:COLORS.red,borderWidth:2,borderDash:[5,5],pointRadius:0,tension:0},{label:'累计兑奖收益',data:rewards,borderColor:COLORS.blue,borderWidth:2.5,pointRadius:0,pointHoverRadius:6,tension:.1},{label:'累计净利润',data:profits,borderColor:COLORS.green,borderWidth:2,backgroundColor:'rgba(15,155,122,.12)',fill:true,pointRadius:context=>context.dataIndex===maxDay-1?7:0,pointBackgroundColor:COLORS.amber,pointBorderColor:'#fff',pointBorderWidth:2,tension:.1}];chart.options.plugins.tooltip.callbacks={title:items=>`第 ${items[0].dataIndex+1} 天`,label:item=>{if(item.datasetIndex!==0)return null;const d=detailed90DaysData[item.dataIndex];return[`累计成本: ${money(d.cumCost,0)}`,`合计成套: ${d.cumSets} 套`,`第 ${d.integerSets} 套奖励: ${money(d.lastSetReward,0)}`,`累计兑奖收益: ${money(d.cumReward)}`,`当前净利润: ${d.netProfit>=0?'+':'-'}${money(Math.abs(d.netProfit))}`]}};chart.options.plugins.annotation.annotations={maxProfitLine:{type:'line',xMin:maxDay-1,xMax:maxDay-1,borderColor:COLORS.amber,borderWidth:2,borderDash:[3,3],label:{display:true,content:[`最大利润点：第 ${maxDay} 天`,`最高净利润：+${money(maxProfit,0)}`],position:'top',backgroundColor:COLORS.amber,color:'#fff',font:{size:11,weight:'bold'},padding:6,borderRadius:6}}};chart.update();renderLegend([{color:'blue',text:'累计兑奖收益'},{color:'red',text:`累计投入成本（${money(tier.baseCost,0)}/天，虚线）`},{color:'green',text:'累计净利润'}],`建议在第 ${maxDay} 天止盈，最高净利润为 +${money(maxProfit)}`,true);$('chartSummary').textContent=`当前为 ${tier.name} 的 90 天累计分析。每日投入 ${money(tier.baseCost,0)}；第 ${maxDay} 天达到最高净利润 +${money(maxProfit)}。`;renderTable(['天数','累计成本','合计成套','累计收益','净利润'],detailed90DaysData.map(d=>[`第 ${d.day} 天`,money(d.cumCost,0),d.cumSets,money(d.cumReward),`${d.netProfit>=0?'+':'-'}${money(Math.abs(d.netProfit))}`]))}
$('totalPulls').addEventListener('input',()=>{clearPresetActive();calculate()});$('orangeCards').addEventListener('input',()=>{clearPresetActive();calculate()});$('presetGroup').addEventListener('click',event=>{const button=event.target.closest('.preset-btn');if(button)applyPreset(Number(button.dataset.probability),button)});$('tiersContainer').addEventListener('change',event=>{if(event.target.name==='tier')selectTier(Number(event.target.value))});$('btnModeSingle').addEventListener('click',()=>switchMode('single'));$('btnMode90Days').addEventListener('click',()=>switchMode('90days'));$('resetZoom').addEventListener('click',()=>{if(typeof chart.resetZoom==='function')chart.resetZoom()});calculate();
</script>
