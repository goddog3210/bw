    .tiers-panel { padding:10px; } .tiers-grid { display:grid; height:100%; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; } .tier-card { position:relative; display:grid; grid-template-columns:max-content minmax(0,1fr); grid-template-areas:"name name" "cost-label cost" "output output" "total total"; column-gap:6px; min-height:0; padding:10px 12px; background:var(--surface-alt); border:2px solid var(--line); border-radius:13px; cursor:pointer; transition:transform .2s,border-color .2s,box-shadow .2s,background .2s; } .tier-card:hover { transform:translateY(-2px); border-color:#a9bce0; } .tier-card:has(input:focus-visible) { box-shadow:var(--focus); } .tier-card.active { background:#fff; border:2px solid var(--blue); box-shadow:0 12px 24px -22px rgba(37,99,235,.9); } .tier-card > input[type=radio] { position:absolute; opacity:0; pointer-events:none; } .tier-selected { position:absolute; top:-10px; left:50%; z-index:2; visibility:hidden; padding:2px 7px; transform:translateX(-50%); color:var(--blue); background:var(--blue-soft); border-radius:99px; font-size:12px; white-space:nowrap; font-weight:800; } .tier-card.active .tier-selected { visibility:visible; } .tier-name { grid-area:name; max-width:none; margin:0; padding-right:54px; font-size:15px; font-weight:800; white-space:nowrap; } .tier-cost-label { grid-area:cost-label; align-self:center; margin:3px 0 0; color:var(--muted); font-size:13px; font-weight:700; white-space:nowrap; } .tier-cost { grid-area:cost; align-self:center; justify-self:start; margin-top:3px; line-height:1; color:var(--amber); font-size:24px; white-space:nowrap; font-weight:850; letter-spacing:-.04em; } .tier-cost small { color:var(--muted); font-size:12px; font-weight:700; } .tier-output { grid-area:output; margin:4px 0 0; color:var(--muted); font-size:13px; white-space:nowrap; } .tier-output strong { color:var(--ink); } .tier-total { grid-area:total; margin:3px 0 0; color:var(--muted); font-size:13px; white-space:nowrap; } .tier-tota     .analysis-panel { padding:12px 16px; } .analysis-top > div:first-child { position:relative; } .analysis-top { display:grid; grid-template-columns:minmax(0,1fr) minmax(320px,520px) minmax(0,1fr); align-items:start; gap:12px; margin-bottom:4px; } .analysis-title { margin:0; font-size:clamp(17px,2vw,21px); line-height:1.25; letter-spacing:-.03em; } .analysis-context { margin:4px 0 0; color:var(--muted); font-size:12px; } .analysis-metric { margin:3px 0 0; color:#38506e; font-size:12px; font-weight:650; } .analysis-actions { display:flex; align-items:center; flex-wrap:wrap; justify-content:flex-end; justify-self:end; gap:9px; } .mode-switch { display:inline-flex; padding:3px; background:#eef3fb; border:1px solid #c9d7eb; border-radius:11px; } .mode-btn { min-height:40px; padding:8px 13px; color:#52657a; font-size:13px; font-weight:800; background:transparent; border:0; border-radius:8px; } .mode-btn:hover { color:var(--blue); background:#f8fbff; } .mode-btn.active { color:#fff; background:var(--blue); box-shadow:0 3px 8px rgba(37,99,235,.28); } .ghost-btn { min-height:38px; padding:7px 10px; color:var(--muted); font-size:12px; font-weight:700; background:#fff; border:1px solid var(--line); border-radius:9px; } .ghost-btn:hover { color:var(--blue); border-color:#a9bce0; } .chart-tip { margin:4px 0 0; color:var(--muted); font-size:12px; } .fusion-summary { position:absolute; top:72px; left:0; margin:0; color:#8a4708; font-size:12px; font-weight:750; white-space:nowrap; } .chart-container { position:relative; height:clamp(300px,38vw,480px); padding:4px 4px 0; } canvas { max-width:100%; }
    .fusion-toggle { display:none; align-items:center; height:38px; padding:7px 10px; color:var(--muted); font-size:12px; font-weight:700; background:#fff; border:1px solid var(--line); border-radius:9px; cursor:pointer; transition:.2s; } .fusion-toggle:hover { color:var(--blue); border-color:#a9bce0; } .fusion-toggle input { position:absolute; opacity:0; pointer-events:none; } .fusion-toggle:has(input:checked) { color:var(--amber); background:var(--amber-soft); border-color:#e8c46b; } .fusion-toggle--disabled { opacity:.55; cursor:not-allowed; } .legend-bar { display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; margin-top:10px; padding:10px 0 0; border-top:1px solid var(--line); } .legend-bar--toolbar { position:relative; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); margin:-24px 0 3px; padding:0 0 5px; border-top:0; border-bottom:1px solid var(--line); } .legend-bar--toolbar .legend-group { position:absolute; z-index:1; top:0; left:50%; width:max-content; justify-content:center; transform:translateX(-50%); } .legend-bar--toolbar .insight { grid-column:3; justify-self:end; margin-top:8px; } .marker-toggle-group{position:absolute;z-index:2;top:35px;left:50%;display:grid;grid-template-columns:repeat(7,max-content);gap:7px;transform:translateX(-50%);white-space:nowrap}.marker-toggle{min-height:26px;padding:3px 9px;color:var(--muted);font-size:12px;font-weight:750;background:#fff;border:1px solid var(--line);border-radius:7px}.marker-toggle:hover{border-color:currentColor}.marker-toggle.active{color:#fff;background:var(--marker-background,var(--marker-color));border-color:var(--marker-border,var(--marker-color))}.legend-group { display:flex; flex-wrap:wrap; gap:10px 15px; margin:0; padding:0; list-style:none; } .legend-item { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; font-weight:650; } .dot { width:9px; height:9px; flex:none; border-radius:50%; } .dot--blue{background:var(--blue)} .dot--green{background:var(--green)} .dot--amber{background:var(--amber)} .dot--red{background:var(--red)} .dot--slate{background:var(--slate)} .insight { max-width:530px; padding:8px 11px; color:#16634f; background:var(--green-soft); border-radius:9px; font-size:12px; font-weight:750; } .insight--amber { color:#8a4708; background:var(--amber-soft); }
    .accessible-summary { margin:10px 0 0; color:var(--muted); font-size:12px; } details { margin-top:10px; background:var(--surface-alt); border:1px solid var(--line); border-radius:10px; } summary { padding:10px 12px; color:var(--ink); font-size:12px; font-weight:750; cursor:pointer; } .table-wrap { overflow-x:auto; padding:0 12px 12px; } table { width:100%; min-width:560px; border-collapse:collapse; font-size:12px; } th,td { padding:8px 10px; text-align:right; border-top:1px solid var(--line); } th { color:var(--muted); font-weight:750; } th:first-child,td:first-child { text-align:left; }
    @media (max-width:620px) { .shell{padding:12px}.overview{grid-template-columns:1fr}.panel,.analysis-panel{padding:14px}.preset-group{grid-template-columns:repeat(4,1fr)}.analysis-top{grid-template-columns:1fr;align-items:stretch}.analysis-actions{justify-content:flex-start;width:100%}.mode-switch{width:100%}.mode-btn{flex:1;padding-inline:7px}.legend-bar{grid-template-columns:1fr}.legend-bar--toolbar .legend-group,.legend-bar--toolbar .insight{grid-column:1}.legend-bar--toolbar .insight{justify-self:stretch}.insight{max-width:none}.chart-container{height:350px}.tiers-grid{grid-template-columns:1fr}.tier-card--midway{grid-column:auto} } @media (max-width:390px) {.input-summary-row{grid-template-columns:1fr}.preset-group{grid-template-columns:repeat(3,1fr)}.tier-card{grid-template-columns:max-content minmax(0,1fr);grid-template-areas:"name name" "cost-label cost" "output output"}.tier-card--anniversary{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"name anniversary-input" "cost-label cost" "output output" "total total"}.tier-card--midway{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"name midway-input" "cost-label cost" "output output"}.tier-selected{top:-10px;left:50%;right:auto}} @media (prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}} @media (forced-colors:active){.tier-card.active,.preset-btn.active,.mode-btn.active{outline:2px solid Highlight;outline-offset:2px}}

<body>
  <main class="shell">
    <div class="dashboard">
      <div class="overview">
        <section class="panel" aria-label="抽卡数据设置">
          <form id="calculatorForm" novalidate><fieldset><legend>输入抽卡数据</legend><div class="input-summary-row"><div class="input-field"><label for="totalPulls">总抽数</label><input type="number" id="totalPulls" value="10000" min="1" step="1" inputmode="decimal"></div><div class="input-field"><label for="orangeCards">橙卡数</label><input type="number" id="orangeCards" value="100" min="0" step="any" inputmode="decimal"></div><div class="probability" aria-live="polite"><span class="probability__label">当前<br>出橙概率</span><output id="probVal">1.000%</output></div></div></fieldset><p class="form-message" id="formMessage" role="alert"></p></form>          <p class="preset-label">快速概率预设</p><div class="preset-group" id="presetGroup" aria-label="快速概率预设"><button type="button" class="preset-btn" data-probability="0.8" data-name="非酋" aria-pressed="false">非酋 0.8%</button><button type="button" class="preset-btn" data-probability="0.9" data-name="小黑" aria-pressed="false">小黑 0.9%</button><button type="button" class="preset-btn active" data-probability="1" data-name="标准" aria-pressed="true">标准 1%</button><button type="button" class="preset-btn" data-probability="1.1" data-name="小欧" aria-pressed="false">小欧 1.1%</button><button type="button" class="preset-btn" data-probability="1.2" data-name="欧皇" aria-pressed="false">欧皇 1.2%</button></div>
        </section>
        <section class="panel tiers-panel" aria-label="成本档位"><div class="tiers-grid" id="tiersContainer" role="radiogroup" aria-label="成本档位"></div></section>
      </div>
      <section class="panel analysis-panel" aria-labelledby="analysis-title"><div class="analysis-top"><div><h2 class="analysis-title" id="chartTitle">收益综合分析</h2><p class="analysis-context" id="analysisContext">选择档位后查看完整数据</p><p class="analysis-metric" id="analysisMetric"></p><p class="chart-tip" id="chartTip">滚轮或双指缩放，拖拽平移；悬停数据点查看详细数值。</p><p class="fusion-summary" id="fusionSummary"></p></div><div class="probability-range probability-range--analysis"><div class="range-meta"><span>非酋 · 0.10%</span><strong>欧非滑块</strong><span>欧皇 · 3.00%</span></div><input id="probabilityRange" type="range" min="0.10" max="3.00" step="0.01" value="1.00" aria-label="出橙概率，范围 0.10% 至 3.00%" aria-valuetext="1.000%"></div><div class="analysis-actions"><div class="mode-switch" role="tablist" aria-label="分析视角"><button class="mode-btn active" id="btnModeSingle" type="button" role="tab" aria-selected="true">单套兑换</button><button class="mode-btn" id="btnMode90Days" type="button" role="tab" aria-selected="false">90 天累计</button></div><button class="ghost-btn" id="resetZoom" type="button">重置缩放</button></div></div><div class="legend-bar legend-bar--toolbar" id="legendBar"></div><figure class="analysis-figure"><div class="chart-container"><canvas id="rewardChart" role="img" aria-labelledby="chartTitle" aria-describedby="analysisContext analysisMetric chartTip"></canvas></div></figure><details><summary>查看当前分析的明细数据</summary><div class="table-wrap" id="dataTable"></div></details></section>
    </div>
  </main>
<script>
const COLORS={blue:'#2563eb',green:'#0f9b7a',amber:'#b45309',red:'#d64545',purple:'#7c3aed',slate:'#52657a',grid:'#e8edf5',tick:'#64748b',tooltip:'#172033'};
const $=id=>document.getElementById(id); const money=(value,digits=2)=>'$'+Number(value).toLocaleString(undefined,{minimumFractionDigits:digits,maximumFractionDigits:digits});
function getSetReward(n){if(n<=0)return 0;let reward=2000,keepCount=0;for(let i=1;i<=n;i++){if(i===1)reward=2000;else if(reward<20000&&keepCount===0){reward*=1.05;if(reward>=20000){reward=20000;keepCount=1}}else if(keepCount>0&&keepCount<5){reward=20000;keepCount++}else reward=Math.max(1000,reward*.975)}return reward}
const singleRewards=[],labels172=[];for(let i=1;i<=200;i++){const reward=getSetReward(i);singleRewards.push(Number(reward.toFixed(2)));labels172.push(`第 ${i} 套`);if(reward===1000&&i>=172)break}
let viewMode='single',selectedTierIndex=1,tiersDataCache=[],detailed90DaysData=[],pendingChartFrame=0,chartUpdateMode=null,fusionCostLineEnabled=false,anniversaryDays=7,midwayTotalPulls=58500,midwayHoldTimer=0,midwayHoldStarted=0;const markerVisibility={profitRange:false,breakEven:true,maxProfit:true,maxRedeemable:false,dailyCost:false,singleCost:true};const FUSION_COST=8640,NORMAL_DAILY_PULLS=650,NORMAL_DAILY_COST=6000,ANNIVERSARY_EXTRA_PULLS=430,ANNIVERSARY_EXTRA_COST=4000,MIDWAY_BASE_PULLS=58500,MIDWAY_BASE_COST=540000,DAYS=90;
const ctx=$('rewardChart').getContext('2d');const chart=new Chart(ctx,{type:'line',data:{labels:[],datasets:[]},options:{responsive:true,maintainAspectRatio:false,layout:{padding:{left:18,right:72}},interaction:{intersect:false,mode:'index'},plugins:{legend:{display:false},tooltip:{backgroundColor:COLORS.tooltip,titleColor:'#fff',bodyColor:'#eef2ff',borderColor:'#334155',borderWidth:1,padding:12,boxPadding:6},zoom:{pan:{enabled:true,mode:'x'},zoom:{wheel:{enabled:true},pinch:{enabled:true},mode:'x'}},annotation:{annotations:{}}},scales:{x:{grid:{color:COLORS.grid},ticks:{color:COLORS.tick,maxTicksLimit:25}},y:{grid:{color:COLORS.grid},ticks:{color:COLORS.tick,callback:value=>'$'+Number(value).toLocaleString()}}}}});

  if(tier.line1&&tier.line2&&tier.line1<=tier.line2){annotations.profitZone={type:'box',xMin:tier.line1-1,xMax:tier.line2-1,backgroundColor:'rgba(15,155,122,.055)',borderWidth:0};if(hasMarker('profitStart'))annotations.profitStartMarker={type:'label',display:markerDefinitions.find(marker=>marker.id==='profitStart').visible,xValue:tier.line1-1,yValue:displayRewards[tier.line1-1],content:`✅ 单套起盈：第 ${tier.line1} 套`,position:'center',xAdjust:context=>markerLabelOffset(context,tier.line1-1,displayRewards[tier.line1-1],markerDefinitions,markerDefinitions.find(marker=>marker.id==='profitStart').order).x,yAdjust:context=>markerLabelOffset(context,tier.line1-1,displayRewards[tier.line1-1],markerDefinitions,markerDefinitions.find(marker=>marker.id==='profitStart').order).y,backgroundColor:'rgba(255,255,255,.94)',color:COLORS.green,font:{size:12,weight:'bold'},padding:{x:6,y:3},borderColor:'rgba(15,155,122,.38)',borderWidth:1,borderRadius:6,callout:{display:true,borderColor:COLORS.green,borderWidth:1,margin:4}};if(hasMarker('profitEnd'))annotations.profitEndMarker={type:'label',display:markerDefinitions.find(marker=>marker.id==='profitEnd').visible,xValue:tier.line2-1,yValue:displayRewards[tier.line2-1],content:`❌ 单套止损：第 ${tier.line2} 套`,position:'center',xAdjust:context=>markerLabelOffset(context,tier.line2-1,displayRewards[tier.line2-1],markerDefinitions,markerDefinitions.find(marker=>marker.id==='profitEnd').order).x,yAdjust:context=>markerLabelOffset(context,tier.line2-1,displayRewards[tier.line2-1],markerDefinitions,markerDefinitions.find(marker=>marker.id==='profitEnd').order).y,backgroundColor:'rgba(255,255,255,.94)',color:COLORS.red,font:{size:12,weight:'bold'},padding:{x:6,y:3},borderColor:'rgba(214,69,69,.38)',borderWidth:1,borderRadius:6,callout:{display:true,borderColor:COLORS.red,borderWidth:1,margin:4}}}
  if(hasMarker('breakEven'))annotations.breakEvenMarker={type:'label',display:markerDefinitions.find(marker=>marker.id==='breakEven').visible,xValue:breakEvenIndex,yValue:displayRewards[breakEvenIndex],content:`↗ 盈亏扭转（第 ${breakEvenDay} 天 ${breakEvenSetCount} 套）`,position:'center',xAdjust:context=>markerLabelOffset(context,breakEvenIndex,displayRewards[breakEvenIndex],markerDefinitions,markerDefinitions.find(marker=>marker.id==='breakEven').order).x,yAdjust:context=>markerLabelOffset(context,breakEvenIndex,displayRewards[breakEvenIndex],markerDefinitions,markerDefinitions.find(marker=>marker.id==='breakEven').order).y,backgroundColor:'rgba(255,255,255,.94)',color:COLORS.purple,font:{size:12,weight:'bold'},padding:{x:6,y:3},borderColor:'rgba(124,58,237,.38)',borderWidth:1,borderRadius:6,callout:{display:true,borderColor:COLORS.purple,borderWidth:1,margin:4}};
  chart.options.plugins.annotation.annotations=annotations;commitChartUpdate();if(chartUpdateMode==='none')return;
  $('fusionSummary').textContent=fusionCostLineEnabled?`溶合成本 ${money(FUSION_COST,0)}：${fusionIntervals.map(interval=>`第 ${interval.start}–${interval.end} 套（共 ${interval.count} 套）`).join('；')}`:'';
  const fusionInsight='';
  renderLegend([{color:'green',text:'1-48递增期5%'},{color:'amber',text:'49-54封顶保持期（$20,000）'},{color:'red',text:'55-171衰减期2.5%'},{color:'slate',text:'172套保底锁死（$1,000）'}],`盈利区间：第 ${tier.line1||'-'} 套至第 ${tier.line2||'-'} 套${fusionInsight}`,false,true);
  renderTable(['兑换套数','单套奖励','累计奖励'],displayRewards.map((reward,index)=>[`第 ${index+1} 套`,money(reward),money(displayRewards.slice(0,index+1).reduce((a,b)=>a+b,0))]))
}
function render90DaysView(tier){$('chartTitle').textContent='90 天累计投入与收益';$('fusionSummary').textContent='';$('analysisContext').textContent=`当前为 ${tier.name} 的 90 天累计分析`;$('analysisMetric').hidden=true;chart.options.scales.y.max=undefined;const {labels,costs,rewards,profits,details,maxProfit,maxDay,breakEvenDay}=get90DayMilestones(tier);detailed90DaysData=details;chart.options.plugins.tooltip.filter=undefined;chart.data.labels=labels;chart.data.datasets=[{label:'累计投入成本',data:costs,borderColor:COLORS.red,borderWidth:2,borderDash:[5,5],pointRadius:0,tension:0},{label:'累计兑奖收益',data:rewards,borderColor:COLORS.blue,borderWidth:2.5,pointRadius:0,pointHoverRadius:6,tension:.1},{label:'累计净利润',data:profits,borderColor:COLORS.green,borderWidth:2,backgroundColor:'rgba(15,155,122,.12)',fill:true,pointRadius:context=>context.dataIndex===maxDay-1?7:0,pointBackgroundColor:COLORS.amber,pointBorderColor:'#fff',pointBorderWidth:2,tension:.1}];chart.options.plugins.tooltip.callbacks={title:items=>`第 ${items[0].dataIndex+1} 天`,label:item=>{if(item.datasetIndex!==0)return null;const d=detailed90DaysData[item.dataIndex];return[`累计成本: ${money(d.cumCost,0)}`,`合计成套: ${d.cumSets} 套`,`第 ${d.integerSets} 套奖励: ${money(d.lastSetReward,0)}`,`累计兑奖收益: ${money(d.cumReward)}`,`当前净利润: ${d.netProfit>=0?'+':'-'}${money(Math.abs(d.netProfit))}`]}};const annotations={maxProfitLine:{type:'line',xMin:maxDay-1,xMax:maxDay-1,borderColor:COLORS.amber,borderWidth:2,borderDash:[3,3],label:{display:true,content:[`最大利润点：第 ${maxDay} 天`,`最高净利润：+${money(maxProfit,0)}`],position:'top',backgroundColor:COLORS.amber,color:'#fff',font:{size:11,weight:'bold'},padding:6,borderRadius:6}}};if(breakEvenDay!==null)annotations.breakEvenLine={type:'line',xMin:breakEvenDay-1,xMax:breakEvenDay-1,borderColor:COLORS.green,borderWidth:2,borderDash:[4,4],label:{display:true,content:`扭亏为盈：第 ${breakEvenDay} 天`,position:'start',backgroundColor:COLORS.green,color:'#fff',font:{size:11,weight:'bold'},padding:6,borderRadius:6}};chart.options.plugins.annotation.annotations=annotations;commitChartUpdate();if(chartUpdateMode==='none')return;$('analysisMetric').textContent=`每日投入 ${money(tier.baseCost,0)}；第 ${maxDay} 天达到最高净利润 +${money(maxProfit)}。`;renderLegend([{color:'blue',text:'累计兑奖收益'},{color:'red',text:`累计投入成本（${money(tier.baseCost,0)}/天，虚线）`},{color:'green',text:'累计净利润'}],`建议在第 ${maxDay} 天止盈，最高净利润为 +${money(maxProfit)}`,true);renderTable(['天数','累计成本','合计成套','累计收益','净利润'],detailed90DaysData.map(d=>[`第 ${d.day} 天`,money(d.cumCost,0),d.cumSets,money(d.cumReward),`${d.netProfit>=0?'+':'-'}${money(Math.abs(d.netProfit))}`]))}
chart.options.onClick=(event)=>{const hit=chart.getElementsAtEventForMode(event,'nearest',{intersect:true},true)[0];if(!hit||!chart.data.datasets[hit.datasetIndex].markerText)return;const active=[{datasetIndex:hit.datasetIndex,index:hit.index}];chart.setActiveElements(active);chart.tooltip.setActiveElements(active,{x:event.x,y:event.y});chart.update('none')};
$('legendBar').addEventListener('click',event=>{const button=event.target.closest('[data-marker-toggle]');if(!button)return;const key=button.dataset.markerToggle;if(key==='fusionCost'){fusionCostLineEnabled=!fusionCostLineEnabled;button.classList.toggle('active',fusionCostLineEnabled);const tier=tiersDataCache[selectedTierIndex];if(tier){const intervals=findFusionCostIntervals();$('fusionSummary').textContent=fusionCostLineEnabled?`溶合成本 ${money(FUSION_COST,0)}：${intervals.map(interval=>`第 ${interval.start}–${interval.end} 套（共 ${interval.count} 套）`).join('；')}`:''}}else{markerVisibility[key]=!markerVisibility[key];button.classList.toggle('active',markerVisibility[key])}updateChartDisplay('none')});
$('probabilityRange').addEventListener('input',event=>{const totalPulls=parseFloat($('totalPulls').value);if(!Number.isFinite(totalPulls)||totalPulls<=0){calculate();return}clearPresetActive();$('orangeCards').value=(totalPulls*Number(event.target.value)/100).toFixed(4).replace(/\.?0+$/,'');calculate(false);scheduleSliderChartUpdate()});$('probabilityRange').addEventListener('change',flushSliderChartUpdate);$('totalPulls').addEventListener('input',()=>{clearPresetActive();calculate()});$('orangeCards').addEventListener('input',()=>{clearPresetActive();calculate()});$('presetGroup').addEventListener('click',event=>{const button=event.target.closest('.preset-btn');if(button)applyPreset(Number(button.dataset.probability),button)});$('tiersContainer').addEventListener('input',event=>{if(event.target.id==='anniversaryDays'){const value=Number(event.target.value);if(Number.isInteger(value)&&value>=0&&value<=DAYS){anniversaryDays=value;selectedTierIndex=1;calculate(false,false);scheduleSliderChartUpdate()}}if(event.target.id==='midwayTotalPulls'){const value=parseFloat(event.target.value);if(Number.isFinite(value)&&value>0){midwayTotalPulls=value;selectedTierIndex=2;calculate(false,false);scheduleSliderChartUpdate()}}});
$('tiersContainer').addEventListener('pointerdown',event=>{const input=event.target;if(input.id!=='midwayTotalPulls')return;const rect=input.getBoundingClientRect();if(event.clientX<rect.right-24)return;event.preventDefault();const direction=event.clientY<rect.top+rect.height/2?1:-1;midwayHoldStarted=Date.now();const adjust=()=>{const elapsed=Date.now()-midwayHoldStarted,multiplier=elapsed>3000?700:elapsed>2000?300:elapsed>1000?50:1,next=Math.max(1,Math.min(150000,midwayTotalPulls+direction*10*multiplier));if(next===midwayTotalPulls){clearInterval(midwayHoldTimer);midwayHoldTimer=0;return}midwayTotalPulls=next;input.value=next;selectedTierIndex=2;calculate(false,false);scheduleSliderChartUpdate()};adjust();midwayHoldTimer=setInterval(adjust,110)});document.addEventListener('pointerup',()=>{if(midwayHoldTimer){clearInterval(midwayHoldTimer);midwayHoldTimer=0}});document.addEventListener('pointercancel',()=>{if(midwayHoldTimer){clearInterval(midwayHoldTimer);midwayHoldTimer=0}});
$('tiersContainer').addEventListener('change',event=>{if(event.target.name==='tier')selectTier(Number(event.target.value));if(event.target.id==='anniversaryDays'){const value=Number(event.target.value);if(!Number.isInteger(value)||value<0||value>DAYS){$('formMessage').textContent='周年庆加抽天数需要是 0 至 90 的整数。';event.target.value=anniversaryDays;return}anniversaryDays=value;selectedTierIndex=1;calculate(false);updateChartDisplay('none')}if(event.target.id==='midwayTotalPulls'){const value=parseFloat(event.target.value);if(!Number.isFinite(value)||value<=0||value>150000){$('formMessage').textContent='中途上车档的 90 天合计抽数需要在 1 至 150,000 之间。';event.target.value=midwayTotalPulls;return}midwayTotalPulls=value;selectedTierIndex=2;calculate(false);updateChartDisplay('none')}});$('btnModeSingle').addEventListener('click',()=>switchMode('single'));$('btnMode90Days').addEventListener('click',()=>switchMode('90days'));$('resetZoom').addEventListener('click',()=>{if(typeof chart.resetZoom==='function')chart.resetZoom()});calculate();
